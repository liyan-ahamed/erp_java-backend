# ERP Backend Application Properties
# ====================================

# Application
spring.application.name=erp-backend

# Server
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# ---- PostgreSQL Database ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:erp_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=ErpHikariPool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-on-validation-error=true
spring.flyway.clean-disabled=false

# ---- JWT ----
app.security.jwt.secret=${JWT_SECRET:default-secret-key-for-development-only-change-in-production-minimum-256-bits}
app.security.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
app.security.jwt.refresh-expiration-ms=${REFRESH_TOKEN_EXPIRATION:604800000}
app.security.jwt.issuer=${JWT_ISSUER:erp-backend}

# ---- CORS ----
app.cors.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ---- Springdoc / Swagger ----
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ---- Logging ----
logging.level.root=INFO
logging.level.com.erp=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=${HIBERNATE_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
